name: Release Automation

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux (x86_64) & Debian Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Tag or Fallback Version
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then
            TAG="v1.0.0"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNIPCLI_BUILD_TESTS=OFF

      - name: Compile and Strip
        run: |
          cmake --build build -j"$(nproc)"
          strip build/snip

      - name: Stage Artifacts (FHS Layout)
        run: |
          cmake --install build --prefix /tmp/stage
          mkdir -p dist
          tar -czf dist/snipcli-${{ steps.meta.outputs.tag }}-linux-x86_64.tar.gz -C /tmp/stage .

      - name: Build Debian (.deb) Package via CPack
        run: |
          cd build
          cpack -G DEB
          cd ..
          DEB_FILE=$(ls build/snipcli_*.deb | head -n 1)
          cp "$DEB_FILE" dist/snipcli_${{ steps.meta.outputs.version }}-1_amd64.deb

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/*
          retention-days: 1

  build-macos:
    name: Build macOS (ARM64)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Tag or Fallback Version
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then
            TAG="v1.0.0"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNIPCLI_BUILD_TESTS=OFF

      - name: Compile and Strip
        run: |
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          strip build/snip

      - name: Stage Artifacts and Package
        run: |
          cmake --install build --prefix /tmp/stage
          mkdir -p dist
          tar -czf dist/snipcli-${{ steps.meta.outputs.tag }}-darwin-arm64.tar.gz -C /tmp/stage .

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist/*
          retention-days: 1

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Tag or Fallback Version
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then
            TAG="v1.0.0"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure CMake (MSVC)
        run: |
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DSNIPCLI_BUILD_TESTS=OFF

      - name: Compile
        run: |
          cmake --build build --config Release

      - name: Stage Artifacts and Package
        shell: bash
        run: |
          mkdir -p /tmp/win_stage
          cp build/Release/snip.exe /tmp/win_stage/
          cp LICENSE NOTICE README.md /tmp/win_stage/
          mkdir -p /tmp/win_stage/completions
          cp completions/* /tmp/win_stage/completions/
          mkdir -p dist
          cd /tmp/win_stage
          7z a "$GITHUB_WORKSPACE/dist/snipcli-${{ steps.meta.outputs.tag }}-windows-x86_64.zip" *

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/*
          retention-days: 1

  draft-release:
    name: Assemble Artifacts & Create Draft Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Dist Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Directory & Checksums
        run: |
          mkdir -p release_assets
          find artifacts -type f -exec cp {} release_assets/ \;
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract Release Notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then
            TAG="v1.0.0"
          fi
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            $0 ~ "^## \\[" && found { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release notes for SnipCLI $TAG" > release_notes.md
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create Draft GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.notes.outputs.tag }}" \
            --title "SnipCLI ${{ steps.notes.outputs.tag }}" \
            --notes-file release_notes.md \
            --draft \
            release_assets/*
